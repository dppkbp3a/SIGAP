<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usulan Kenaikan Gaji Berkala (KGB) - DPPKBP3A</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- HEADER / NAVBAR -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-file-invoice-dollar text-2xl"></i>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Sistem Usulan KGB</h1>
                    <p class="text-xs text-indigo-200">DPPKBP3A KABUPATEN KUNINGAN</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <!-- Badge Identitas Login -->
                <div class="text-right">
                    <p id="user-name" class="font-semibold text-sm">Memuat...</p>
                    <span id="user-badge" class="inline-block px-2 py-0.5 text-xs rounded-full bg-indigo-500 text-white font-medium">
                        ...
                    </span>
                </div>
                <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
                </button>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="container mx-auto px-4 py-8 flex-1">
        
        <!-- SECTION 1: FORM PENGAJUAN (HANYA UNTUK PEGAWAI) -->
        <section id="section-form-pegawai" class="hidden bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center">
                <i class="fa-solid fa-paper-plane mr-2 text-indigo-600"></i> Form Usulan KGB Baru Tahun 2026
            </h2>
            
            <form id="form-usulan-kgb" onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">NIP Pegawai</label>
                    <input type="text" id="input-nip" readonly class="w-full bg-gray-100 border border-gray-300 rounded-lg p-2.5 text-sm text-gray-600 cursor-not-allowed">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="input-nama" readonly class="w-full bg-gray-100 border border-gray-300 rounded-lg p-2.5 text-sm text-gray-600 cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Usulan KGB 2026</label>
                    <input type="date" id="input-tmt" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Unggah Berkas Pendukung (PDF)</label>
                    <input type="file" id="input-berkas" accept=".pdf" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>

                <div class="md:col-span-2 text-right mt-2">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition">
                        <i class="fa-solid fa-paper-plane mr-1"></i> Kirim Usulan KGB
                    </button>
                </div>
            </form>
        </section>

        <!-- SECTION 2: TABEL DATA USULAN KGB -->
        <section class="bg-white p-6 rounded-xl shadow-md">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 border-b pb-4">
                <div>
                    <h2 class="text-lg font-bold text-gray-800 flex items-center">
                        <i class="fa-solid fa-list-check mr-2 text-indigo-600"></i>
                        <span id="table-title">Daftar Usulan KGB 2026</span>
                    </h2>
                    <p class="text-sm text-gray-500 mt-1" id="table-description">Memuat data...</p>
                </div>

                <!-- Kontrol Pencarian -->
                <div class="w-full sm:w-auto flex gap-2">
                    <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Cari NIP / Nama / Gol..." class="w-full sm:w-64 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>

            <!-- TABEL DENGAN SCROLL RESPONSIVE -->
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b">
                        <tr>
                            <th class="px-3 py-3 text-center">No</th>
                            <th class="px-4 py-3">NIP & Nama Pegawai</th>
                            <th class="px-3 py-3">Jabatan & Gol</th>
                            <th class="px-3 py-3">KGB Terakhir</th>
                            <th class="px-3 py-3">Usulan KGB 2026</th>
                            <th class="px-3 py-3">KGB Berikutnya</th>
                            <th class="px-3 py-3 text-center">Status</th>
                            <th class="px-3 py-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="kgb-table-body">
                        <!-- Data dari Excel dimasukkan secara dinamis -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        &copy; 2026 DPPKBP3A Kabupaten Kuningan - Sistem Informasi Usulan KGB
    </footer>

        ];

        // 1. INI CEK AUTENTIKASI DARI USER SESSION
        document.addEventListener('DOMContentLoaded', () => {
            let userSession = JSON.parse(localStorage.getItem('user_session'));

            // Default fallback untuk pengujian jika belum login
            if (!userSession) {
                userSession = { isAdmin: true, nama: 'Administrator DPPKBP3A', nip: 'ADMIN-001' };
                localStorage.setItem('user_session', JSON.stringify(userSession));
            }

            renderUserProfile(userSession);
            renderKgbTable(userSession);
        });

        // 2. PROFILE USER SESUAI AKUN LOGIN
        function renderUserProfile(user) {
            const userNameEl = document.getElementById('user-name');
            const userBadgeEl = document.getElementById('user-badge');
            const formSection = document.getElementById('section-form-pegawai');
            const tableTitle = document.getElementById('table-title');
            const tableDesc = document.getElementById('table-description');

            if (user.isAdmin) {
                userNameEl.textContent = "Administrator";
                userBadgeEl.textContent = "Mode Admin";
                userBadgeEl.className = "inline-block px-2 py-0.5 text-xs rounded-full bg-red-600 text-white font-medium";

                formSection.classList.add('hidden');

                tableTitle.textContent = "Kelola Usulan KGB Pegawai 2026";
                tableDesc.textContent = `Menampilkan total ${mockKgbData.length} PNS DPPKBP3A yang diusulkan KGB tahun 2026.`;
            } else {
                userNameEl.textContent = user.nama;
                userBadgeEl.textContent = "Pegawai";
                userBadgeEl.className = "inline-block px-2 py-0.5 text-xs rounded-full bg-green-600 text-white font-medium";

                document.getElementById('input-nip').value = user.nip;
                document.getElementById('input-nama').value = user.nama;
                
                formSection.classList.remove('hidden');

                tableTitle.textContent = "Riwayat Usulan KGB Saya";
                tableDesc.textContent = "Status pengajuan Usulan KGB Tahun 2026 milik Anda.";
            }
        }

        // 3. RENDER TABEL DATA
        function renderKgbTable(user) {
            const tbody = document.getElementById('kgb-table-body');
            tbody.innerHTML = '';

            const userNipClean = user.nip ? user.nip.replace(/\s+/g, '') : '';

            // Admin melihat semua data, Pegawai hanya melihat datanya
            const filteredData = user.isAdmin 
                ? mockKgbData 
                : mockKgbData.filter(item => item.nip.replace(/\s+/g, '') === userNipClean);

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-gray-400">Belum ada data usulan KGB.</td></tr>`;
                return;
            }

            filteredData.forEach((item, index) => {
                let statusBadge = '';
                if (item.status === 'Pending') statusBadge = '<span class="bg-yellow-100 text-yellow-800 text-xs px-2.5 py-0.5 rounded-full font-medium">Pending</span>';
                else if (item.status === 'Disetujui') statusBadge = '<span class="bg-green-100 text-green-800 text-xs px-2.5 py-0.5 rounded-full font-medium">Disetujui</span>';
                else if (item.status === 'Ditolak') statusBadge = '<span class="bg-red-100 text-red-800 text-xs px-2.5 py-0.5 rounded-full font-medium">Ditolak</span>';

                let actionButtons = '';
                if (user.isAdmin) {
                    if (item.status === 'Pending') {
                        actionButtons = `
                            <div class="flex justify-center space-x-1">
                                <button onclick="updateStatus(${item.id}, 'Disetujui')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-2 py-1 rounded transition" title="Setujui">
                                    <i class="fa-solid fa-check"></i>
                                </button>
                                <button onclick="updateStatus(${item.id}, 'Ditolak')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded transition" title="Tolak">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;
                    } else {
                        actionButtons = `<span class="text-xs text-gray-400 italic">Verifikasi Selesai</span>`;
                    }
                } else {
                    actionButtons = `
                        <button onclick="alert('Membuka Berkas PDF...')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs px-2.5 py-1 rounded transition">
                            <i class="fa-solid fa-file-pdf"></i> Berkas
                        </button>
                    `;
                }

                const row = `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="px-3 py-3 text-center">${index + 1}</td>
                        <td class="px-4 py-3">
                            <div class="font-semibold text-gray-900">${item.nama}</div>
                            <div class="text-xs text-gray-500">NIP: ${item.nip}</div>
                        </td>
                        <td class="px-3 py-3">
                            <div class="text-gray-800">${item.jabatan}</div>
                            <div class="text-xs font-bold text-indigo-600">Gol. ${item.gol}</div>
                        </td>
                        <td class="px-3 py-3 whitespace-nowrap">${item.kgbTerakhir}</td>
                        <td class="px-3 py-3 font-semibold text-indigo-700 whitespace-nowrap">${item.usulan2026}</td>
                        <td class="px-3 py-3 whitespace-nowrap">${item.kgbBerikutnya}</td>
                        <td class="px-3 py-3 text-center whitespace-nowrap">${statusBadge}</td>
                        <td class="px-3 py-3 text-center whitespace-nowrap">${actionButtons}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // 4. SUBMIT FORM UNTUK PEGAWAI
        function handleFormSubmit(e) {
            e.preventDefault();
            const userSession = JSON.parse(localStorage.getItem('user_session'));
            const tmt = document.getElementById('input-tmt').value;

            const newUsulan = {
                id: Date.now(),
                nip: userSession.nip,
                nama: userSession.nama,
                jabatan: "Pegawai DPPKBP3A",
                gol: "-",
                kgbTerakhir: "-",
                usulan2026: tmt,
                kgbBerikutnya: "-",
                status: 'Pending'
            };

            mockKgbData.unshift(newUsulan);
            alert("Usulan KGB Berhasil Dikirim!");
            document.getElementById('form-usulan-kgb').reset();
            renderUserProfile(userSession);
            renderKgbTable(userSession);
        }

        // 5. UPDATE STATUS OLEH ADMIN
        function updateStatus(id, statusBaru) {
            const item = mockKgbData.find(d => d.id === id);
            if (item) {
                item.status = statusBaru;
                alert(`Usulan KGB untuk ${item.nama} berhasil diubah menjadi: ${statusBaru}`);
                const userSession = JSON.parse(localStorage.getItem('user_session'));
                renderKgbTable(userSession);
            }
        }

        // 6. LOGOUT
        function handleLogout() {
            localStorage.removeItem('user_session');
            alert("Anda telah keluar.");
            window.location.href = "login.html";
        }

        // 7. PENCARIAN & FILTER
        function filterTable() {
            const searchValue = document.getElementById('search-input').value.toLowerCase();
            const rows = document.querySelectorAll('#kgb-table-body tr');

            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchValue) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
