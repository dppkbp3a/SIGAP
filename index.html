<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIGAP DPPKBP3A BAGIAN UMUM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-image: url('logoSIGAP1.png'); background-size: cover; background-position: center; background-repeat: no-repeat;" class="h-screen flex items-center justify-center text-white">

    <div class="w-full max-w-md p-8 bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl border border-white/10">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto mb-4 flex items-center justify-center">
                <img src="logo.png" alt="Logo DPPKBP3A" class="max-h-full object-contain" onerror="this.src='https://via.placeholder.com/80?text=SIGAP'">
            </div>
            <h1 class="text-3xl font-bold tracking-wider">SIGAP BAGIAN UMUM</h1>
            <p class="text-xs text-blue-900 mt-1">Sistem Informasi Dan Monitoring Agenda Pegawai</p>
        </div>

        <!-- Form Login -->
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2" for="username">NIP / Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-blue-900">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Masukkan NIP atau Username" 
                        class="w-full pl-10 pr-4 py-2.5 bg-white/5 border border-white/20 rounded-lg focus:outline-none focus:border-blue-400 text-sm placeholder-gray-400 text-white">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-2" for="password">Kata Sandi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-blue-900">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full pl-10 pr-4 py-2.5 bg-white/5 border border-white/20 rounded-lg focus:outline-none focus:border-blue-900 text-sm placeholder-blur-900 text-white">
                </div>
            </div>

            <!-- Pilihan Mode Admin / Pegawai -->
            <div class="mb-6">
                <label class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-2">MASUK SEBAGAI:</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center space-x-2 bg-gray-50 border border-gray-300 px-3 py-2 rounded-lg cursor-pointer hover:bg-gray-100 transition text-gray-800">
                        <input type="radio" name="loginMode" value="admin" class="text-blue-600 focus:ring-blue-400">
                        <span class="text-xs font-semibold"><i class="fa-solid fa-user-shield mr-1"></i> Mode Admin</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-gray-50 border border-gray-300 px-3 py-2 rounded-lg cursor-pointer hover:bg-gray-100 transition text-gray-800">
                        <input type="radio" name="loginMode" value="pegawai" checked class="text-blue-600 focus:ring-blue-400">
                        <span class="text-xs font-semibold"><i class="fa-solid fa-user mr-1"></i> Mode Pegawai</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 transition duration-300 font-semibold py-2.5 rounded-lg shadow-md text-sm">
                Masuk 
            </button>
        </form>

        <div class="text-center mt-6 text-xs text-gray-400">
            &copy; 2026 Dinas DPPKBP3A Kab. Kuningan. All rights reserved.
        </div>
    </div>

    <!-- Script Validasi Login -->
    <script>
      // DAFTAR PEGAWAI DPPKBP3A
      const DATA_PEGAWAI = {
          "198111102006042007": "NOPA PUJIHASTUTI, SE., M.A.P.",
          "197008101990021001": "Drs. H. KEPALA DINAS, M.Si",
          "197001011990031001": "SEKRETARIS DINAS",
          "197505121998031002": "Kabid Pengendalian Penduduk, S.Sos",
          "198203152005012003": "Kabid KB & Sejahtera, S.KM",
          "198508202010011004": "Kabid Perlindungan Anak, M.Si",
          "198812042011012005": "Kasubag Umum & Kepegawaian",
          "199002102014021006": "Analis Kepegawaian Ahli Pertama",
          "199306182019032007": "Pengelola Data Kepegawaian"
      };

      const ADMIN_NIP = "198111102006042007";

      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        const selectedMode = document.querySelector('input[name="loginMode"]:checked').value;
        const kataSandiSama = "31Agustus2026";

        if (passwordInput === kataSandiSama) {
          // PAKSA CLEAR SESSION SEBELUM SET DATA BARU
          localStorage.removeItem("userRole");
          localStorage.removeItem("userNip");
          localStorage.removeItem("user_nip");
          localStorage.removeItem("user_nama");

          // 1. JIKA MEMILIH MODE ADMIN
          if (selectedMode === "admin") {
            if (usernameInput !== ADMIN_NIP) {
              alert("Akses Ditolak! NIP tersebut bukan NIP Administrator yang sah.");
              return;
            }
            localStorage.setItem("userRole", "admin");
            localStorage.setItem("userNip", ADMIN_NIP);
            localStorage.setItem("user_nip", ADMIN_NIP);
            localStorage.setItem("user_nama", DATA_PEGAWAI[ADMIN_NIP] || "NOPA PUJIHASTUTI, SE., M.A.P.");
            window.location.href = "dashboard.html";
            return;
          } 
          
          // 2. JIKA MEMILIH MODE PEGAWAI
          if (selectedMode === "pegawai") {
            if (usernameInput === ADMIN_NIP) {
              alert("NIP ini merupakan NIP Administrator. Silakan pilih 'Mode Admin' untuk masuk.");
              return;
            }
            if (/^\d+$/.test(usernameInput)) {
              const namaPegawai = DATA_PEGAWAI[usernameInput] || "Pegawai DPPKBP3A";

              localStorage.setItem("userRole", "pegawai");
              localStorage.setItem("userNip", usernameInput);
              localStorage.setItem("user_nip", usernameInput);
              localStorage.setItem("user_nama", namaPegawai);

              window.location.href = "dashboard.html";
              return;
            }
          }

          alert("Username atau NIP tidak valid!");
          return;
        }

        alert("Kata Sandi salah!");
      });
    </script>

</body>
</html>
